<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 3박4일 일정 (10/7–10/10)</title>
<style>
/* DESIGN-apple.md 토큰 */
:root{
  color-scheme:light only;
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --ink-80:#333333; --ink-48:#7a7a7a; --body-muted:#cccccc;
  --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --tile:#272729; --chip:#d2d2d7;
  --hairline:#e0e0e0; --divider:#f0f0f0;
  --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
  --font:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Display","Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-0.374px;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
button,a,input{-webkit-tap-highlight-color:transparent}
button:active,a:active{transform:scale(0.95)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}

/* header */
header{padding:48px 4px 24px}
h1{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.14;margin:0 0 8px;letter-spacing:-0.28px}
.lede{color:var(--ink-48);font-size:14px;line-height:1.43;letter-spacing:-0.224px;margin:0}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.flight{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:14px}
.flight .k{font-size:12px;color:var(--ink-48);font-weight:400;letter-spacing:-0.12px}
.flight .t{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.14;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-0.28px;color:var(--ink)}
.flight .d{font-size:13px;color:var(--ink-80);line-height:1.43;letter-spacing:-0.224px;margin-top:8px}

/* tabs: frosted sub-nav */
nav.tabs{position:sticky;top:0;z-index:10;background:rgba(245,245,247,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 12px;margin:0 -16px;border-bottom:1px solid rgba(0,0,0,.08)}
.tabrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:var(--r-md);padding:8px 2px;font:inherit;cursor:pointer;text-align:center;transition:transform .15s ease}
.tab b{display:block;font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.224px}
.tab span{display:block;font-size:12px;color:var(--ink-48);line-height:1.3;letter-spacing:-0.12px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-selected="true"] span{color:var(--body-muted)}
.tab .today{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-left:3px;vertical-align:2px}
.tab[aria-selected="true"] .today{background:var(--primary-on-dark)}

/* day head: dark tile */
.day{display:none}
.day.on{display:block}
.dayhead{background:var(--tile);color:#fff;border-radius:var(--r-lg);padding:24px;margin:16px 0 24px}
.dayhead .date{font-size:14px;font-weight:400;color:var(--body-muted);letter-spacing:-0.224px}
.dayhead h2{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.19;margin:4px 0 17px;letter-spacing:-0.28px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;font-size:12px;font-weight:400;letter-spacing:-0.12px}
.route span{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:var(--r-pill)}
.route i{font-style:normal;color:var(--ink-48);padding:0 2px}
.fc{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:17px}
.fc div{background:rgba(255,255,255,.08);border-radius:var(--r-md);padding:8px 12px;line-height:1.29}
.fc .lb{display:block;font-size:12px;color:var(--body-muted);letter-spacing:-0.12px}
.fc .v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;letter-spacing:-0.224px}
.fc .v em{font-style:normal;font-size:18px;line-height:1}
.fc .v{flex-wrap:wrap;row-gap:0}.fc .v small{font-size:12px;font-weight:400;color:var(--body-muted);white-space:nowrap}
.fc .tp{font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.fc .tp .lo{color:var(--body-muted)}.fc .tp .hi{color:#fff}
.fcnote{font-size:12px;color:var(--ink-48);margin-top:8px;letter-spacing:-0.12px}
.wx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:17px;padding-top:17px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;letter-spacing:-0.224px}
.wx b{font-weight:400;color:var(--body-muted);margin-right:2px}
.wx a{color:#fff;background:var(--primary);text-decoration:none;font-weight:400;padding:6px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:4px}
.wx a::after{content:"↗";font-size:12px}
.summary{margin:0 4px 24px;color:var(--ink-80);font-size:17px}

/* notes */
.note{display:flex;gap:12px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:17px;margin:0 0 12px;font-size:14px;line-height:1.43;letter-spacing:-0.224px;color:var(--ink-80)}
.note .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:var(--ink);margin-top:1px}
.note b{display:block;font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-0.374px;color:var(--ink);margin-bottom:4px}
.note.ok .ic{background:var(--ink-48)}

/* stops */
.stops{list-style:none;margin:24px 0 0;padding:0}
.stop{position:relative;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:17px;display:grid;grid-template-columns:40px 1fr;gap:12px}
.stop .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--parchment)}
.tmrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.stop .tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.29;letter-spacing:-0.224px;color:var(--ink);background:var(--parchment);padding:3px 10px;border-radius:var(--r-pill)}
.stop.key .tm{color:#fff;background:var(--ink)}
.stop .tm.alt{font-weight:400;color:var(--ink-48);background:transparent;padding-left:0}
.meal,.chip{display:inline-block;font-size:12px;font-weight:400;padding:3px 9px;border-radius:var(--r-pill);line-height:1.3;letter-spacing:-0.12px;color:var(--ink-80);background:var(--parchment)}
.stop h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0;line-height:1.24;letter-spacing:-0.374px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.check{background:transparent;border:1px solid var(--chip);padding:2px 8px}
.stop p{margin:8px 0 0;font-size:14px;color:var(--ink-80);line-height:1.43;letter-spacing:-0.224px}
.addr{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-48);letter-spacing:-0.12px}
.addr a{flex:none;color:var(--primary);font-size:14px;font-weight:400;text-decoration:none;border:1px solid var(--primary);padding:3px 12px;border-radius:var(--r-pill);letter-spacing:-0.224px}
.addr span{min-width:0}
.move{display:flex;align-items:center;gap:10px;padding:12px 4px 12px 14px;font-size:12px;color:var(--ink-48);font-weight:400;letter-spacing:-0.12px;position:relative}
.move::before{content:"";position:absolute;left:20px;top:0;bottom:0;border-left:1px dashed var(--chip)}
.move svg{flex:none;position:relative;background:var(--parchment);z-index:1}
.gap{height:12px}

/* now / past */
.stop,.move{transition:opacity .3s ease,border-color .3s ease,box-shadow .3s ease}
.stop.past,.move.past{opacity:.45}
.stop.now{border-color:var(--primary-focus);box-shadow:0 0 0 1px var(--primary-focus)}
.stop.now .tm{color:#fff;background:var(--primary)}
.nowtag{display:none;position:absolute;top:-1px;right:17px;width:34px;padding:9px 0 16px;background:#EF4B5B;color:#fff;font-size:12px;font-weight:600;line-height:1.2;text-align:center;letter-spacing:-0.12px;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.stop.now .nowtag{display:block}

/* checklist */
.ckgroup{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:8px 17px 4px;margin-bottom:12px}
.ckgroup h3{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:-0.28px;margin:12px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.ckgroup h3 small{font-size:14px;color:var(--ink-48);font-weight:400;letter-spacing:-0.224px}
.cl{list-style:none;margin:0;padding:0}
.cl li{border-top:1px solid var(--divider)}
.cl li:first-child{border-top:0}
.cl label{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 0;font-size:17px;cursor:pointer;line-height:1.3}
.cl input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;flex:none;border-radius:50%;border:1.5px solid var(--chip);background:var(--canvas);display:grid;place-items:center;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.cl input:checked{background:var(--primary);border-color:var(--primary)}
.cl input:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cl input:checked + span{color:var(--ink-48);text-decoration:line-through}
footer{margin-top:48px;color:var(--ink-48);font-size:12px;line-height:1.5;letter-spacing:-0.12px;text-align:center}
@media (max-width:380px){.stop{grid-template-columns:36px 1fr;padding:14px}.tab b{font-size:13px}h1{font-size:26px}}
</style>
</head>

<header>
  <h1>11개월 아기와 제주 3박 4일</h1>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ?now=2026-10-07T15:50 으로 특정 시각을 미리 볼 수 있어요
const nowOverride=(()=>{const q=new URLSearchParams(location.search).get('now');const d=q&&new Date(q);return d&&!isNaN(d)?d:null})();
const getNow=()=>nowOverride||new Date();
const ymdOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayYmd=(()=>{const d=getNow();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();

const WXI={'맑음':'☀️','구름조금':'🌤️','구름많음':'⛅','흐림':'☁️','비':'🌧️'};
function renderFc(w){if(!w)return'';const c=(lb,x)=>`<div><span class="lb">${lb}</span><span class="v"><em aria-hidden="true">${WXI[x[0]]||''}</em>${esc(x[0])}<small>☂ ${x[1]}%</small></span></div>`;
return `<div class="fc">${c('오전',w.am)}${c('오후',w.pm)}<div><span class="lb">최저·최고</span><span class="tp"><span class="lo">${w.lo}°</span> / <span class="hi">${w.hi}°</span></span></div></div><div class="fcnote">네이버 '제주날씨' 주간예보 · 10/6 오전 기준</div>`}
function renderDay(d){
  let h=`<section class="day" id="${d.id}" role="tabpanel">
  <div class="dayhead"><div class="date">${esc(d.date)}</div><h2>${esc(d.title)}</h2>
  <div class="route">${d.route.map(r=>`<span>${esc(r)}</span>`).join('<i>›</i>')}</div>${renderFc(d.w)}${d.wx?`<div class="wx"><b>최신 예보</b>${d.wx.map(w=>`<a href="https://search.naver.com/search.naver?query=${encodeURIComponent(w[1])}" target="_blank" rel="noopener">${esc(w[0])}</a>`).join('')}</div>`:''}</div>
  <p class="summary">${esc(d.summary)}</p>`;
  d.notes.forEach(n=>{h+=`<div class="note ${n.type}"><span class="ic">${n.type==='ok'?'✓':'!'}</span><div><b>${esc(n.title)}</b>${esc(n.text)}</div></div>`});
  h+='<ol class="stops">';
  let prevStop=false,lastMin='';
  d.items.forEach(it=>{
    if(it.move){h+=`<li class="move" data-move="1">${CAR}<span>${esc(it.move)}</span></li>`;prevStop=false;return}
    if(prevStop)h+='<li class="gap" aria-hidden="true"></li>';
    const meal=it.meal?`<span class="meal ${it.meal[0]}">${esc(it.meal[1])}</span>`:'';
    const chips=it.chips?`<div class="chips">${it.chips.map(c=>`<span class="chip ${c[0]}">${esc(c[1])}</span>`).join('')}</div>`:'';
    const addr=(it.addr||it.map)?`<div class="addr">${it.map?`<a href="https://map.naver.com/p/search/${encodeURIComponent(it.map)}" target="_blank" rel="noopener">지도</a>`:''}<span>${esc(it.addr||'')}</span></div>`:'';
    const MICON={breakfast:'🍳',lunch:'🍚',dinner:'🍽️',snack:'🍦'};
    let icon='📍';
    if(it.ico)icon=it.ico;
    else if(it.chips?.some(c=>c[0]==='flight'))icon='✈️';
    else if(it.meal)icon=MICON[it.meal[0]]||'🍽️';
    else if(it.chips?.some(c=>c[0]==='baby'))icon='🧸';
    else if(/체크인|숙소|리조트/.test(it.h))icon='🏨';
    else if(/반납|렌터카|인수/.test(it.h))icon='🚙';
    const hm=/^(\d\d):(\d\d)$/.exec(it.t);if(hm)lastMin=+hm[1]*60+ +hm[2];
    h+=`<li class="stop${it.key?' key':''}" data-min="${lastMin}"><span class="nowtag">지금</span><div class="ico">${icon}</div>
    <div><div class="tmrow"><span class="tm${it.alt?' alt':''}">${esc(it.t)}</span>${meal}</div><h3>${esc(it.h)}</h3>${chips}${it.p?`<p>${esc(it.p)}</p>`:''}${addr}</div></li>`;
    prevStop=true;
  });
  return h+'</ol></section>';
}
function renderCheck(){
  let h=`<section class="day" id="check" role="tabpanel"><div class="dayhead"><div class="date">출발 전</div><h2>이수 짐 챙기기</h2><div class="route"><span id="ckcount"></span></div></div>`;
  CHECK.forEach(g=>{
    h+=`<div class="ckgroup"><h3>${esc(g.title)}<small data-g="${esc(g.title)}"></small></h3><ul class="cl">`;
    g.items.forEach(([id,t])=>{h+=`<li><label><input type="checkbox" id="ck_${id}"><span>${esc(t)}</span></label></li>`});
    h+='</ul></div>';
  });
  return h+'</section>';
}

const tabrow=document.getElementById('tabrow'),main=document.getElementById('days');
main.innerHTML=DAYS.map(renderDay).join('')+renderCheck();
tabrow.innerHTML=DAYS.map(d=>`<button class="tab" role="tab" data-day="${d.id}"><b>${d.tab}${d.ymd===todayYmd?'<span class="today" aria-label="오늘"></span>':''}</b><span>${d.date.split(' ·')[0]}</span></button>`).join('')+`<button class="tab" role="tab" data-day="check"><b>준비물</b><span>체크</span></button>`;

function show(id){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.day===id?'true':'false'));
  document.querySelectorAll('.day').forEach(s=>s.classList.toggle('on',s.id===id));
  try{localStorage.setItem('jejuTab2',id)}catch(e){}
}
tabrow.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){show(b.dataset.day);window.scrollTo({top:Math.min(window.scrollY,document.querySelector('nav.tabs').offsetTop),behavior:'auto'})}});

function updateCount(){
  const all=document.querySelectorAll('.cl input'),done=[...all].filter(c=>c.checked).length;
  document.getElementById('ckcount').textContent=`${done} / ${all.length} 완료`;
  document.querySelectorAll('.ckgroup').forEach(g=>{const c=g.querySelectorAll('input'),n=[...c].filter(x=>x.checked).length;g.querySelector('small').textContent=`${n}/${c.length}`});
}
// 서버(Turso)가 있으면 가족 모두와 공유, 없으면(GitHub Pages 등) 이 기기에만 저장
let shared=false;
async function loadShared(){
  try{
    const r=await fetch('api/checks',{cache:'no-store'});
    if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))return;
    const data=await r.json();shared=true;
    document.querySelectorAll('.cl input').forEach(cb=>{if(cb.id in data){cb.checked=data[cb.id]===1;try{localStorage.setItem(cb.id,cb.checked?'1':'0')}catch(e){}}});
    updateCount();
  }catch(e){}
}
document.querySelectorAll('.cl input').forEach(cb=>{
  try{if(localStorage.getItem(cb.id)==='1')cb.checked=true}catch(e){}
  cb.addEventListener('change',()=>{
    try{localStorage.setItem(cb.id,cb.checked?'1':'0')}catch(e){}
    updateCount();
    if(shared)fetch('api/checks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cb.id,done:cb.checked})}).catch(()=>{});
  });
});
updateCount();
loadShared();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadShared()});
setInterval(()=>{if(!document.hidden)loadShared()},20000);

let start=DAYS.find(d=>d.ymd===todayYmd)?.id;
if(!start){try{start=localStorage.getItem('jejuTab2')}catch(e){}}
show(document.getElementById(start||'')?start:'day1');

// 오늘 일정에서 지금 시간에 해당하는 항목을 강조하고 지난 항목은 흐리게
function markNow(){
  const now=getNow(),ymd=ymdOf(now),min=now.getHours()*60+now.getMinutes();
  let cur=null;
  DAYS.forEach(d=>{
    const lis=[...document.querySelectorAll(`#${d.id} .stops > li`)];
    lis.forEach(li=>li.classList.remove('now','past'));
    if(d.ymd!==ymd)return;
    const stops=lis.filter(li=>li.dataset.min!==undefined&&li.dataset.min!=='');
    const curMin=Math.max(-1,...stops.map(li=>+li.dataset.min).filter(m=>m<=min));
    if(curMin<0)return;
    let reached=false;
    lis.forEach(li=>{
      if(li.dataset.min!==undefined&&+li.dataset.min===curMin){li.classList.add('now');reached=true;cur=cur||li}
      else if(!reached)li.classList.add('past');
    });
  });
  return cur;
}
const firstNow=markNow();
if(firstNow&&firstNow.closest('.day.on'))setTimeout(()=>firstNow.scrollIntoView({block:'center',behavior:'smooth'}),300);
if(!nowOverride)setInterval(markNow,30000);
</script>
